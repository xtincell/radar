name: Réception Radar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reception:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: recette-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check server/pgrest.js && node --check server/visuels.js && node --check server/ingest.js && node --check functions/_feed.js && node --check briefs/chrome.js
      - run: npm test
        env:
          RADAR_TEST_ADMIN_URL: postgresql://postgres:recette-ci@127.0.0.1:5432/postgres

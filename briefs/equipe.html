<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("radar:theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar — Équipe</title>
<link rel="stylesheet" href="colors_and_type.css?v=20260622">
<style>
  :root{
    --c-cad:#FF6A14;--c-frc:#2D6BD4;--c-eco:#1F9D63;--c-bel:#E23D2E;--c-nsi:#9A3F57;
    --c-sof:#8F3208;--c-dan:#3E8FA8;--c-dlf:#C2440A;--c-trx:#5E6B30;--c-flo:#B07A1E;
    --c-fok:#7C5026;--c-other:#9A8F80;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-text,'Hanken Grotesk',system-ui,sans-serif);
    background:
      radial-gradient(1200px 700px at 88% -8%, var(--bg-app-warm) 0%, transparent 60%),
      var(--bg-app);
    color:var(--fg1);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1180px;margin:0 auto;padding:22px 30px 90px}

  /* ---- topbar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);
    padding:10px 12px 10px 16px;box-shadow:var(--shadow-md);position:sticky;top:14px;z-index:30}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--ink-950);color:var(--paper-0);
    display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:18px;position:relative}
  .brand .mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:3px;background:var(--orange-500)}
  .brand .bt{font-family:var(--font-display);font-weight:500;font-size:15px;line-height:1.05}
  .brand .bt b{color:var(--orange-600);font-weight:700}
  .brand .bs{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
  .nav{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  .nav a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--fg2);
    font-size:13.5px;font-weight:600;padding:9px 13px;border-radius:var(--radius-pill);transition:background .13s,color .13s;white-space:nowrap}
  .nav a:hover{background:var(--paper-100);color:var(--fg1)}
  .nav a.active{background:var(--ink-950);color:var(--paper-0)}

  /* ---- masthead ---- */
  .masthead{margin:34px 2px 14px}
  .kick{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--orange-600);font-weight:600}
  .masthead h1{font-family:var(--font-display);font-weight:500;font-size:clamp(30px,3.6vw,46px);
    line-height:1.02;letter-spacing:var(--tracking-tight);margin:8px 0 6px}
  .masthead h1 em{font-style:normal;color:var(--orange-600)}
  .masthead p{margin:0;color:var(--fg2);font-size:15px;max-width:64ch}
  .masthead p b{color:var(--fg1)}

  /* ---- stat strip ---- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 8px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px}
  .stat .sv{font-family:var(--font-display);font-weight:500;font-size:38px;line-height:1;letter-spacing:var(--tracking-tight);font-feature-settings:'tnum' 1}
  .stat .sl{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);margin-top:7px}
  .stat.alert .sv{color:var(--danger)}
  .stat.warn .sv{color:var(--orange-600)}

  /* ---- toolbar ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 6px}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-pill);padding:11px 16px}
  .search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;width:100%;color:var(--fg1)}
  .search svg{color:var(--fg3);flex:0 0 auto}
  .export-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg1);
    font:inherit;font-size:13px;font-weight:600;padding:10px 15px;border-radius:var(--radius-pill);cursor:pointer;transition:.13s}
  .export-btn:hover{border-color:var(--orange-400);color:var(--orange-600);background:var(--accent-soft)}

  /* ---- grille équipe ---- */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:14px;margin-top:18px}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px 17px 14px;display:flex;flex-direction:column;gap:12px;transition:border-color .13s,box-shadow .13s}
  .pcard:hover{box-shadow:0 6px 22px rgba(40,30,18,.07)}
  .pcard.has-late{border-color:var(--danger)}
  .phd{display:flex;align-items:center;gap:11px}
  .pav{width:42px;height:42px;border-radius:12px;background:var(--ink-950);color:#fff;display:grid;place-items:center;
    font-family:var(--font-display);font-weight:600;font-size:18px;flex:0 0 auto}
  .pcard.has-late .pav{background:var(--danger)}
  .pcard.unassigned .pav{background:var(--orange-500)}
  .pnm{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:var(--tracking-snug);line-height:1.1}
  .pmeta{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .pcounts{display:flex;gap:8px;flex-wrap:wrap}
  .pc{display:flex;flex-direction:column;gap:2px;background:var(--paper-50);border:1px solid var(--border);border-radius:10px;padding:7px 11px;min-width:58px}
  .pc .v{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1;font-feature-settings:'tnum' 1}
  .pc .l{font-family:var(--font-mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3)}
  .pc.late .v{color:var(--danger)} .pc.soon .v{color:var(--orange-600)}
  .pbar{height:7px;border-radius:5px;background:var(--paper-100);overflow:hidden}
  .pbar>span{display:block;height:100%;background:var(--orange-500);border-radius:5px;min-width:5px}
  .pcard.has-late .pbar>span{background:var(--danger)}
  .ptop{display:flex;flex-direction:column;gap:3px}
  .ptop a{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg1);font-size:13px;padding:6px 8px;border-radius:8px;transition:background .12s}
  .ptop a:hover{background:var(--paper-100)}
  .ptop .tnd{font-family:var(--font-mono);font-size:10px;color:var(--fg3);flex:0 0 auto}
  .ptop .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .ptop .ttag{font-family:var(--font-mono);font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:var(--radius-pill);white-space:nowrap;text-transform:uppercase}
  .ttag.late{background:var(--danger);color:#fff}
  .ttag.soon{background:var(--orange-50);color:var(--orange-700)}
  .ttag.block{background:var(--ink-950);color:#fff}
  .ttag.wait{background:var(--orange-50);color:var(--orange-700)}
  .ttag.todo{background:var(--paper-100);color:var(--fg2)}
  .pmore{font-size:11.5px;color:var(--fg3);padding:2px 8px}
  .pgo{margin-top:auto;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;text-decoration:none;
    font-size:13px;font-weight:700;color:var(--orange-600);padding:7px 2px 1px}
  .pgo:hover{text-decoration:underline}

  .empty{text-align:center;color:var(--fg3);padding:50px 20px;font-size:15px;font-family:var(--font-display)}
  .src{font-family:var(--font-mono);font-size:10.5px;color:var(--fg4);margin-top:22px;text-align:right}

  @media (max-width:760px){
    .shell{padding:18px 16px 70px}
    .topbar{flex-wrap:wrap;border-radius:var(--radius-xl)}
    .nav{order:5;width:100%;overflow-x:auto}
    .stats{grid-template-columns:repeat(2,1fr)}
    .team-grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">

  <div id="mtg-top" data-page="equipe" data-sub="charge par responsable"></div>

  <div class="masthead">
    <div class="kick">Qui porte quoi</div>
    <h1>L'<em>équipe</em></h1>
    <p id="sub">Chargement…</p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <label class="search">
      <i data-lucide="search" style="width:17px;height:17px"></i>
      <input id="search" type="text" placeholder="Filtrer par nom…">
    </label>
    <button class="export-btn" id="export-csv" title="Télécharger l'état actuel de la base au format CSV">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Export CSV</button>
  </div>

  <div id="grid"></div>
  <div class="src" id="src"></div>

</div>

<script src="https://unpkg.com/lucide@1.21.0"></script>
<script src="supa.js?v=20260639"></script>
<script src="ui.js?v=20260639"></script>
<script src="chrome.js?v=20260637"></script>
<script src="export-csv.js?v=20260621"></script>
<script>
"use strict";

/* ============================================================
   Équipe — tableau de charge par responsable (lecture seule).
   Une carte par personne : à faire / en retard / cette semaine,
   barre de charge, 3 tâches les plus urgentes, et un lien
   « voir ses tâches » → todo.html?resp=NOM (vue perso de la personne).
   Réutilise la logique d'urgence de todo.html et le découpage des
   responsables composés (ui.js : splitOwners / ownsTask).
   ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initial = s => ((s||"").trim().charAt(0).toUpperCase() || "?");
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

const TODAY = new Date(new Date().toDateString());
const DAY = 864e5;
const DONE_STATUS = new Set(["Livré","Livré (cycle)","Validé","Bouclé","Archivé"]);
const DEAD_STATUS = new Set(["Bouclé","Archivé","Frozen","Envoyé dans Slack"]);
const normResp = r => (r||"").trim();

// triage local partagé avec le radar / le to-do (cohérence du « traité »)
const TKEY="radar:radar:done:";
const isTraite = nd => { try{ return localStorage.getItem(TKEY+nd)==="1"; }catch(e){ return false; } };

const hasDL = m => /^\d{4}-\d{2}-\d{2}$/.test(m.deadline||"");
const effDone = m => DONE_STATUS.has(m.statut) || isTraite(m.ndeg);
const dlDate = m => new Date(m.deadline+"T00:00:00");
const isLate = m => hasDL(m) && !effDone(m) && dlDate(m) < TODAY;
const daysLate = m => Math.round((TODAY-dlDate(m))/DAY);
const daysTo = m => Math.round((dlDate(m)-TODAY)/DAY);
const fmtDL = m => { const d=dlDate(m); return isNaN(d)?"":d.getDate()+" "+MONTHS[d.getMonth()]; };

function isActionable(m){
  if(m.entree==="Doublon" || (m.ndeg||"").charAt(0)==="≈") return false;
  if(DEAD_STATUS.has(m.statut)) return false;
  return true;
}
// même hiérarchie d'urgence que todo.html
function group(m){
  if(isLate(m))                                 return "late";
  if(hasDL(m) && daysTo(m)>=0 && daysTo(m)<=7)  return "soon";
  if(m.statut==="Bloqué")                       return "block";
  if(m.statut==="En attente client")            return "wait";
  return "todo";
}
const GORDER = {late:0,soon:1,block:2,wait:3,todo:4};
const GLABEL = {late:m=>`Retard ${daysLate(m)}j`,soon:m=>(daysTo(m)===0?"auj.":daysTo(m)===1?"demain":"J-"+daysTo(m)),
  block:()=>"Bloqué",wait:()=>"Attente",todo:m=>(hasDL(m)?fmtDL(m):"à planifier")};
const PRIO_RANK = p => ({P0:0,P1:1,P2:2,P3:3}[p] ?? 2);

let ALL=[];
let state={ q:"" };

function urgencySort(a,b){
  const ga=GORDER[group(a)], gb=GORDER[group(b)];
  if(ga!==gb) return ga-gb;
  if(isLate(a)&&isLate(b)) return dlDate(a)-dlDate(b);
  if(group(a)==="soon") return daysTo(a)-daysTo(b);
  if(PRIO_RANK(a.prio)!==PRIO_RANK(b.prio)) return PRIO_RANK(a.prio)-PRIO_RANK(b.prio);
  return (a.ndeg||"").localeCompare(b.ndeg||"",undefined,{numeric:true});
}

// construit la liste des personnes + leurs tâches (responsables composés comptés par personne)
function buildPeople(){
  const active = ALL.filter(m=>isActionable(m)&&!effDone(m));
  const map = new Map();            // nom -> tâches
  const unassigned = [];
  active.forEach(m=>{
    const raw = (m.responsable||"").trim();
    const owners = splitOwners(m.responsable);
    // sans responsable réel (vide OU placeholder « réunion / à programmer / stand by ») → à assigner.
    // On ne perd aucune tâche : tout ce qui n'a pas de vraie personne tombe ici.
    if(!raw || !owners.length || /réunion|stand ?by|à programmer/i.test(raw)){
      unassigned.push(m); return;
    }
    owners.forEach(n=>{ if(!map.has(n)) map.set(n,[]); map.get(n).push(m); });
  });
  let people = [...map.entries()].map(([name,tasks])=>({
    name,
    tasks: tasks.slice().sort(urgencySort),
    total: tasks.length,
    late: tasks.filter(isLate).length,
    soon: tasks.filter(m=>group(m)==="soon").length,
  }));
  // tri : d'abord ceux qui ont du retard, puis la charge la plus lourde
  people.sort((a,b)=> b.late-a.late || b.total-a.total || a.name.localeCompare(b.name,"fr"));
  return { people, unassigned, activeCount: active.length };
}

function taskLine(m){
  const g=group(m);
  return `<a href="tache.html?code=${encodeURIComponent(m.ndeg)}" title="${esc(m.projet)}">
    <span class="tnd">${esc(m.ndeg)}</span>
    <span class="ttl">${esc(m.projet)||"<i>sans titre</i>"}</span>
    <span class="ttag ${g}">${esc(GLABEL[g](m))}</span></a>`;
}

function personCard(p, maxTotal){
  const w = Math.max(6, Math.round(p.total/maxTotal*100));
  const top = p.tasks.slice(0,3).map(taskLine).join("");
  const more = p.total>3 ? `<div class="pmore">+${p.total-3} autre${p.total-3>1?"s":""}…</div>` : "";
  return `<div class="pcard${p.late?' has-late':''}">
    <div class="phd">
      <a href="personne.html?nom=${encodeURIComponent(p.name)}" title="Voir la fiche de ${esc(p.name)}" style="text-decoration:none"><div class="pav">${esc(initial(p.name))}</div></a>
      <div><a class="pnm" href="personne.html?nom=${encodeURIComponent(p.name)}" style="color:inherit;text-decoration:none" title="Voir sa fiche individuelle">${esc(p.name)}</a><div class="pmeta">${p.total} tâche${p.total>1?"s":""} en cours</div></div>
    </div>
    <div class="pcounts">
      <div class="pc"><span class="v">${p.total}</span><span class="l">À faire</span></div>
      <div class="pc late"><span class="v">${p.late}</span><span class="l">En retard</span></div>
      <div class="pc soon"><span class="v">${p.soon}</span><span class="l">≤ 7 j</span></div>
    </div>
    <div class="pbar"><span style="width:${w}%"></span></div>
    <div class="ptop">${top}${more}</div>
    <a class="pgo" href="todo.html?resp=${encodeURIComponent(p.name)}">Voir ses tâches
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>`;
}

function unassignedCard(list){
  const top=list.slice().sort(urgencySort).slice(0,3).map(taskLine).join("");
  const more=list.length>3?`<div class="pmore">+${list.length-3} autre${list.length-3>1?"s":""}…</div>`:"";
  return `<div class="pcard unassigned">
    <div class="phd">
      <div class="pav">?</div>
      <div><div class="pnm">À assigner</div><div class="pmeta">sans responsable</div></div>
    </div>
    <div class="pcounts">
      <div class="pc"><span class="v">${list.length}</span><span class="l">Tâches</span></div>
      <div class="pc late"><span class="v">${list.filter(isLate).length}</span><span class="l">En retard</span></div>
    </div>
    <div class="ptop">${top}${more}</div>
  </div>`;
}

function render(){
  const { people, unassigned, activeCount } = buildPeople();
  const q=state.q.toLowerCase().trim();
  const shown = q ? people.filter(p=>p.name.toLowerCase().includes(q)) : people;

  $("#stats").innerHTML =
    `<div class="stat"><div class="sv">${people.length}</div><div class="sl">Personnes en charge</div></div>`+
    `<div class="stat"><div class="sv">${activeCount}</div><div class="sl">Tâches actives</div></div>`+
    `<div class="stat alert"><div class="sv">${people.filter(p=>p.late).length}</div><div class="sl">Personnes avec du retard</div></div>`+
    `<div class="stat warn"><div class="sv">${unassigned.length}</div><div class="sl">À assigner</div></div>`;

  $("#sub").innerHTML = `<b>${people.length}</b> personne${people.length>1?"s":""} en charge · <b>${activeCount}</b> tâche${activeCount>1?"s":""} actives. `+
    `Clique une carte pour ouvrir la vue perso de la personne.`;

  const host=$("#grid");
  if(!people.length && !unassigned.length){ host.innerHTML=`<div class="empty">Aucune tâche active pour l'instant.</div>`; lucideGo(); return; }
  if(!shown.length && !(!q && unassigned.length)){ host.innerHTML=`<div class="empty">Personne ne correspond à « ${esc(state.q)} ».</div>`; lucideGo(); return; }

  const maxTotal = Math.max(1, ...people.map(p=>p.total));
  let html = shown.map(p=>personCard(p,maxTotal)).join("");
  if(!q && unassigned.length) html += unassignedCard(unassigned);
  host.innerHTML = `<div class="team-grid">${html}</div>`;
  lucideGo();
}
function lucideGo(){ if(window.lucide) window.lucide.createIcons(); }

function bind(){
  $("#search").addEventListener("input",e=>{ state.q=e.target.value; render(); });
  $("#export-csv").addEventListener("click", e=>exportBriefsCSV(e.currentTarget));
}

async function boot(){
  try{ ALL=await loadBriefsLive(); }catch(e){ ALL=[]; }
  bind(); render();
  const src=(window.SUPA_SOURCE==="supabase")?"Source : Supabase (live)"
          :(window.SUPA_SOURCE==="csv")?"Source : INDEX.csv (hors-ligne)":"Source : —";
  $("#src").textContent=src;
  if(window.sourceBanner) sourceBanner();
  lucideGo();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>

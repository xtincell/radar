<!DOCTYPE html>

  <meta charset="utf-8">
  <script>try{if(localStorage.getItem("radar:theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    button { font-family: var(--font-sans); }
    .r26-icon svg { display: block; }
    /* Responsive : les grilles inline passent en 1 colonne, les panneaux sticky se posent */
    @media (max-width: 1120px) {
      main [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
      main [style*="position: sticky"] { position: static !important; }
    }
    /* Mobile : les rangées type tableau défilent horizontalement plutôt que d'écraser */
    @media (max-width: 760px) {
      main [style*="border-radius: var(--radius-xl)"] { overflow-x: auto !important; }
      main h1, main [style*="font-size: 34px"] { font-size: 26px !important; }
    }
  </style>
  <!-- Runtimes auto-hébergés (briefs/vendor) — aucun CDN, comme les polices. -->

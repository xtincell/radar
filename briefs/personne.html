<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("matanga:theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matanga — Fiche</title>
<link rel="stylesheet" href="colors_and_type.css?v=20260622">
<style>
  :root{
    --c-cad:#FF6A14;--c-frc:#2D6BD4;--c-eco:#1F9D63;--c-bel:#E23D2E;--c-nsi:#9A3F57;
    --c-sof:#8F3208;--c-dan:#3E8FA8;--c-dlf:#C2440A;--c-trx:#5E6B30;--c-flo:#B07A1E;
    --c-fok:#7C5026;--c-other:#9A8F80;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--font-text,'Hanken Grotesk',system-ui,sans-serif);
    background:radial-gradient(1100px 650px at 88% -8%, var(--bg-app-warm) 0%, transparent 60%),var(--bg-app);
    background-attachment:fixed;color:var(--fg1);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 28px 90px}

  .backbar{display:flex;align-items:center;gap:12px;margin:22px 2px 6px}
  .backbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg2);
    font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;text-decoration:none;transition:.13s}
  .backbtn:hover{border-color:var(--orange-400);color:var(--orange-600)}

  /* en-tête personne */
  .phead{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-xl,18px);box-shadow:var(--shadow-md);padding:22px 26px;margin-top:10px}
  .phead .big-av{width:64px;height:64px;border-radius:18px;background:var(--ink-950);color:#fff;display:grid;place-items:center;
    font-family:var(--font-display);font-weight:600;font-size:28px;flex:0 0 auto}
  .phead .pi{min-width:0}
  .phead .kick{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--orange-600);font-weight:600}
  .phead h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3vw,38px);line-height:1.05;letter-spacing:var(--tracking-snug);margin:6px 0 0}
  .phead .psub{color:var(--fg2);font-size:14px;margin-top:6px}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 8px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
  .stat .sv{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1;letter-spacing:var(--tracking-tight);font-feature-settings:'tnum' 1}
  .stat .sl{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);margin-top:6px}
  .stat.alert .sv{color:var(--danger)} .stat.warn .sv{color:var(--orange-600)}

  .sect{margin:28px 2px 4px;display:flex;align-items:center;gap:12px}
  .sect h2{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:var(--tracking-snug);margin:0}
  .sect .gline{flex:1;height:1px;background:var(--border)} .sect .gn{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}
  .sect a.more{font-size:12.5px;font-weight:700;color:var(--orange-600);text-decoration:none} .sect a.more:hover{text-decoration:underline}

  .rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:12px 15px;text-decoration:none;color:inherit;transition:border-color .13s,box-shadow .13s}
  .row:hover{border-color:var(--orange-300);box-shadow:0 4px 16px rgba(40,30,18,.06)}
  .row .nd{font-family:var(--font-mono);font-size:11.5px;color:var(--fg3);font-weight:600;white-space:nowrap}
  .row .info{min-width:0}
  .row .pt{font-weight:600;font-size:14.5px;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ps{font-size:12px;color:var(--fg3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ttag{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;text-transform:uppercase}
  .ttag.late{background:var(--danger);color:#fff} .ttag.soon{background:var(--orange-50);color:var(--orange-700)}
  .ttag.block{background:var(--ink-950);color:#fff} .ttag.wait{background:var(--orange-50);color:var(--orange-700)} .ttag.todo{background:var(--paper-100);color:var(--fg2)}

  /* commentaires liés */
  .cmt-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .cmt{background:var(--paper-50);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .cmt.obs{background:color-mix(in srgb,var(--orange-500) 7%,var(--surface));border-color:color-mix(in srgb,var(--orange-500) 28%,var(--border))}
  .cmt-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .cmt-task{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--orange-700);text-decoration:none;background:color-mix(in srgb,var(--orange-500) 10%,#fff);border:1px solid color-mix(in srgb,var(--orange-500) 22%,var(--border));border-radius:999px;padding:2px 9px}
  .cmt-task:hover{background:color-mix(in srgb,var(--orange-500) 18%,#fff)}
  .cmt-who{font-weight:700;font-size:13px;color:var(--fg1)}
  .cmt-role{font-family:var(--font-mono);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--paper-200);color:var(--fg2)}
  .cmt-role.aut{background:color-mix(in srgb,var(--info,#2D6BD4) 14%,#fff);color:var(--info,#2D6BD4)}
  .cmt-role.imp{background:color-mix(in srgb,var(--orange-500) 16%,#fff);color:var(--orange-700)}
  .cmt-kind{font-family:var(--font-mono);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--paper-200);color:var(--fg2)}
  .cmt-kind.obs{background:color-mix(in srgb,var(--orange-500) 16%,#fff);color:var(--orange-700)}
  .cmt-when{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);margin-left:auto}
  .cmt-body{font-size:13.5px;line-height:1.5;color:var(--fg1);word-break:break-word;white-space:pre-wrap}
  .cmt-body a{color:var(--orange-600);font-weight:600}
  .cmt-itags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .cmt-itag{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:11px;font-weight:700;color:var(--orange-700);
    background:color-mix(in srgb,var(--orange-500) 12%,#fff);border:1px solid color-mix(in srgb,var(--orange-500) 26%,var(--border));border-radius:999px;padding:2px 9px}

  .empty{text-align:center;color:var(--fg3);padding:34px 20px;font-size:14.5px;font-family:var(--font-display)}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
  .pk{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);color:var(--fg1);font:inherit;font-size:14.5px;
    font-weight:600;padding:13px 15px;border-radius:var(--radius-md);text-decoration:none;transition:.12s}
  .pk:hover{border-color:var(--orange-400);color:var(--orange-700)}
  .pk .av{width:30px;height:30px;border-radius:50%;background:var(--ink-900);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
  .src{font-family:var(--font-mono);font-size:10.5px;color:var(--fg4);margin-top:24px;text-align:right}

  @media(max-width:760px){ .wrap{padding:16px 14px 70px} .stats{grid-template-columns:repeat(2,1fr)} .phead{flex-wrap:wrap} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="mtg-top" data-page="" data-sub="fiche"></div>

  <div class="backbar">
    <a class="backbtn" href="equipe.html"><i data-lucide="arrow-left" style="width:15px;height:15px"></i>Équipe</a>
  </div>

  <div id="fiche"><div class="empty">Chargement…</div></div>
  <div class="src" id="src"></div>
</div>

<script src="https://unpkg.com/lucide@1.21.0"></script>
<script src="supa.js?v=20260641"></script>
<script src="ui.js?v=20260640"></script>
<script src="chrome.js?v=20260637"></script>
<script>
"use strict";
/* ============================================================
   Fiche individuelle — personne.html?nom=<NOM>
   Compile : les tâches dont la personne est responsable + TOUS les
   commentaires/observations où elle est auteur OU impliquée.
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>{const p=(n||"").trim().split(/\s+/);if(!p[0])return"?";return((p[0][0]||"")+(p.length>1?(p[1][0]||""):"")).toUpperCase();};
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const TODAY=new Date(new Date().toDateString());
const DAY=864e5;
const DONE_STATUS=new Set(["Envoyé dans Slack","Livré","Livré (cycle)","Validé","Bouclé","Archivé"]);
const DEAD_STATUS=new Set(["Bouclé","Archivé"]);
const normResp=r=>(r||"").replace(/Dérick/g,"Derick").trim();

const hasDL=m=>/^\d{4}-\d{2}-\d{2}$/.test(m.deadline||"");
const effDone=m=>DONE_STATUS.has(m.statut);
const dlDate=m=>new Date(m.deadline+"T00:00:00");
const isLate=m=>hasDL(m)&&!effDone(m)&&dlDate(m)<TODAY;
const daysLate=m=>Math.round((TODAY-dlDate(m))/DAY);
const daysTo=m=>Math.round((dlDate(m)-TODAY)/DAY);
const fmtDL=m=>{const d=dlDate(m);return isNaN(d)?"":d.getDate()+" "+MONTHS[d.getMonth()];};
function isActionable(m){ if(m.entree==="Doublon"||(m.ndeg||"").charAt(0)==="≈")return false; if(DEAD_STATUS.has(m.statut))return false; return true; }
function group(m){ if(isLate(m))return"late"; if(hasDL(m)&&daysTo(m)>=0&&daysTo(m)<=7)return"soon"; if(m.statut==="Bloqué")return"block"; if(m.statut==="En attente client")return"wait"; return"todo"; }
const GORDER={late:0,soon:1,block:2,wait:3,todo:4};
const GLABEL={late:m=>`Retard ${daysLate(m)}j`,soon:m=>(daysTo(m)===0?"auj.":daysTo(m)===1?"demain":"J-"+daysTo(m)),block:()=>"Bloqué",wait:()=>"Attente",todo:m=>(hasDL(m)?fmtDL(m):"à planifier")};
const PRIO_RANK=p=>({P0:0,P1:1,P2:2,P3:3}[p]??2);
function urgencySort(a,b){ const ga=GORDER[group(a)],gb=GORDER[group(b)]; if(ga!==gb)return ga-gb;
  if(isLate(a)&&isLate(b))return dlDate(a)-dlDate(b); if(group(a)==="soon")return daysTo(a)-daysTo(b);
  if(PRIO_RANK(a.prio)!==PRIO_RANK(b.prio))return PRIO_RANK(a.prio)-PRIO_RANK(b.prio);
  return (a.ndeg||"").localeCompare(b.ndeg||"",undefined,{numeric:true}); }

function cmtWhen(iso){ const d=new Date(iso); if(isNaN(d))return""; return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}); }
function getNom(){ return (new URLSearchParams(location.search).get("nom")||"").trim(); }

let ALL=[];

function taskRow(m){
  const g=group(m);
  return `<a class="row" href="tache.html?code=${encodeURIComponent(m.ndeg)}">
    <span class="nd">${esc(m.ndeg)}</span>
    <span class="info"><span class="pt">${esc(m.projet)||"<i>sans titre</i>"}</span>
      <span class="ps">${esc([m.marque,m.client].filter(Boolean).join(" · "))}</span></span>
    <span class="ttag ${g}">${esc(GLABEL[g](m))}</span></a>`;
}
function cmtRow(c, nom){
  const obs=c.kind==="observation";
  const body=esc(c.body||"").replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">lien ↗</a>');
  const isAuthor=c.author===nom;
  const inv=Array.isArray(c.involved)?c.involved.filter(Boolean):[];
  const role=isAuthor?`<span class="cmt-role aut">a écrit</span>`:`<span class="cmt-role imp">impliqué·e</span>`;
  const others=inv.filter(n=>n!==nom);
  return `<div class="cmt${obs?' obs':''}">
    <div class="cmt-hd">
      <a class="cmt-task" href="tache.html?code=${encodeURIComponent(c.ndeg)}">${esc(c.ndeg)}</a>
      <span class="cmt-who">${esc(c.author||"—")}</span>
      ${role}${obs?'<span class="cmt-kind obs">observation</span>':''}
      <span class="cmt-when">${esc(cmtWhen(c.created_at))}</span>
    </div>
    <div class="cmt-body">${body}</div>
    ${others.length?`<div class="cmt-itags">${others.map(n=>`<a class="cmt-itag" href="personne.html?nom=${encodeURIComponent(n)}">👤 ${esc(n)}</a>`).join("")}</div>`:""}
  </div>`;
}

function renderPicker(){
  const team=(window.teamFrom?teamFrom(ALL):[]);
  $("#fiche").innerHTML=`<div class="sect"><h2>Choisis une personne</h2><span class="gline"></span></div>
    <div class="picker-grid">${team.map(n=>`<a class="pk" href="personne.html?nom=${encodeURIComponent(n)}"><span class="av">${esc(initials(n))}</span>${esc(n)}</a>`).join("")}</div>`;
  lucideGo();
}

async function renderFiche(nom){
  // tâches dont la personne est responsable (seule ou co-responsable)
  const owns = m => (window.ownsTask?ownsTask(m.responsable,nom):normResp(m.responsable).includes(nom));
  const mine = ALL.filter(m=>isActionable(m)&&owns(m));
  const active = mine.filter(m=>!effDone(m)).sort(urgencySort);
  const late = active.filter(isLate).length;
  const soon = active.filter(m=>group(m)==="soon").length;

  // commentaires liés (auteur OU impliqué)
  let comments=[];
  if(window.SUPA_SOURCE==="supabase" && window.loadCommentsByPerson){
    try{ comments=await loadCommentsByPerson(nom); }catch(e){ comments=[]; }
  }
  const obsCount=comments.filter(c=>c.kind==="observation").length;

  const head=`<div class="phead">
    <div class="big-av">${esc(initials(nom))}</div>
    <div class="pi"><div class="kick">Fiche individuelle</div><h1>${esc(nom)}</h1>
      <div class="psub">Tâches portées + commentaires & observations où ${esc(nom)} est impliqué·e.</div></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="sv">${active.length}</div><div class="sl">À faire</div></div>
    <div class="stat alert"><div class="sv">${late}</div><div class="sl">En retard</div></div>
    <div class="stat warn"><div class="sv">${soon}</div><div class="sl">≤ 7 jours</div></div>
    <div class="stat"><div class="sv">${comments.length}</div><div class="sl">Commentaires liés</div></div>
    <div class="stat"><div class="sv">${obsCount}</div><div class="sl">Observations</div></div>
  </div>`;

  const tasksSect=`<div class="sect"><h2>Ses tâches actives</h2><span class="gline"></span>
    <a class="more" href="todo.html?resp=${encodeURIComponent(nom)}">tout voir →</a></div>`
    + (active.length?`<div class="rows">${active.slice(0,12).map(taskRow).join("")}</div>`
        :`<div class="empty">Aucune tâche active à son nom.</div>`);

  const cmtSect=`<div class="sect"><h2>Commentaires & observations liés</h2><span class="gline"></span><span class="gn">${comments.length}</span></div>`
    + (window.SUPA_SOURCE!=="supabase"
        ? `<div class="empty">Disponible uniquement en ligne (base live).</div>`
        : comments.length?`<div class="cmt-list">${comments.map(c=>cmtRow(c,nom)).join("")}</div>`
          :`<div class="empty">Aucun commentaire ne mentionne ${esc(nom)} pour l'instant.</div>`);

  $("#fiche").innerHTML=head+tasksSect+cmtSect;
  document.title="Matanga — "+nom;
  lucideGo();
}

function lucideGo(){ if(window.lucide) window.lucide.createIcons(); }

async function boot(){
  try{ ALL=await loadBriefsLive(); }catch(e){ ALL=[]; }
  const nom=getNom();
  if(nom) await renderFiche(nom); else renderPicker();
  const src=(window.SUPA_SOURCE==="supabase")?"Source : Supabase (live)":(window.SUPA_SOURCE==="csv")?"Source : INDEX.csv (hors-ligne)":"Source : —";
  $("#src").textContent=src;
  if(window.sourceBanner) sourceBanner();
  lucideGo();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>

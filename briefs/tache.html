<style>
  /* page dédiée à UNE tâche — réutilise les classes dossier de radar.css (.kv, .dr-sect, .dossier, .doc-chip, .dr-doc, .dbadge, .dr-sel, .dr-btn, .dr-mini) */
  body{background-image:radial-gradient(1100px 650px at 88% -8%, var(--bg-app-warm) 0%, transparent 60%),var(--bg-app);background-attachment:fixed}
  .wrap{max-width:880px;margin:0 auto;padding:22px 26px 90px}
  /* topbar (aligné sur entrees/todo) */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-pill);padding:10px 12px 10px 16px;box-shadow:var(--shadow-md);position:sticky;top:14px;z-index:30}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--ink-950);color:var(--paper-0);display:grid;place-items:center;
    font-family:var(--font-display);font-weight:600;font-size:18px;position:relative}
  .brand .mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:3px;background:var(--orange-500)}
  .brand .bt{font-family:var(--font-display);font-weight:500;font-size:15px;line-height:1.05}.brand .bt b{color:var(--orange-600);font-weight:700}
  .brand .bs{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
  .nav{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  .nav a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--fg2);font-size:13.5px;font-weight:600;
    padding:9px 13px;border-radius:var(--radius-pill);transition:.13s;white-space:nowrap;border:0;background:transparent;cursor:pointer;font-family:inherit}
  .nav a:hover{background:var(--paper-100);color:var(--fg1)}

  .backbar{display:flex;align-items:center;gap:12px;margin:22px 2px 6px}
  .backbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg2);
    font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;text-decoration:none;transition:.13s}
  .backbtn:hover{border-color:var(--orange-400);color:var(--orange-600)}

  .tache{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);overflow:hidden;margin-top:10px}
  .t-head{padding:26px 30px 20px;border-bottom:1px solid var(--border)}
  .t-head .dn{font-family:var(--font-mono);font-size:12.5px;color:var(--orange-600);font-weight:600;letter-spacing:.05em}
  .t-head h1{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3vw,34px);line-height:1.12;letter-spacing:var(--tracking-snug);margin:9px 0 14px}
  .t-body{padding:8px 30px 50px}
  /* dépendances */
  .deps{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
  .deps-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .deps-lbl{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);font-weight:700;min-width:80px;padding-top:5px}
  .deps-list{display:flex;flex-wrap:wrap;gap:7px;flex:1}
  .dep-chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--paper-50);color:var(--fg2);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dep-chip:hover{border-color:var(--orange-400);color:var(--orange-700)}
  .dep-chip.open{border-color:color-mix(in srgb,var(--orange-500) 40%,var(--border));color:var(--orange-700);background:color-mix(in srgb,var(--orange-500) 8%,#fff)}
  .dep-chip.done{color:var(--success)}
  .dep-chip.blocking{border-color:color-mix(in srgb,var(--danger) 35%,var(--border));color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,#fff)}
  .dep-warn{font-size:12.5px;color:var(--danger);font-weight:600;margin-top:2px}
  /* deux porteurs en exergue */
  .whorow{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}

  .whochip.dem .av{background:var(--paper-200);color:var(--fg2)} .whochip.resp .av{background:var(--orange-200);color:var(--ink-900)}
  .whochip .wl{line-height:1.15} .whochip .wlbl{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3)}
  .whochip .wnm{font-size:13.5px;font-weight:600}
  .loadbox{padding:70px 20px;text-align:center;color:var(--fg3);font-family:var(--font-display);font-size:16px}
  /* formulaire d'édition complète */
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;margin:12px 0 8px}
  .edit-grid label{display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3)}

  .edit-grid input,.edit-grid select,.edit-grid textarea{font:inherit;font-size:14px;color:var(--fg1);background:var(--surface);
    border:1px solid var(--border);border-radius:9px;padding:9px 11px;text-transform:none;letter-spacing:0;width:100%;box-sizing:border-box}
  .edit-grid textarea{min-height:74px;resize:vertical;line-height:1.42}
  .edit-grid input:focus,.edit-grid select:focus,.edit-grid textarea:focus{outline:2px solid var(--orange-400);outline-offset:0;border-color:transparent}
  .edit-dirty{font-family:var(--font-mono);font-size:11px;color:var(--orange-600);margin:2px 2px 0;min-height:14px}
  @media(max-width:680px){.wrap{padding:16px 14px 70px}.t-head,.t-body{padding-left:18px;padding-right:18px}.nav{order:5;width:100%;overflow-x:auto}.topbar{flex-wrap:wrap;border-radius:var(--radius-xl)}.edit-grid{grid-template-columns:1fr}}
  /* ── suivi & sources des mises à jour ── */

  .upd-badge{font-family:var(--font-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;background:var(--paper-200);color:var(--fg2)}

  .upd-badge.mail{background:#e3edfb;color:#1f5fb0} .upd-badge.ppt{background:#fde3d6;color:#c2440a}
  .upd-badge.meet{background:#fdeccb;color:#9a6a12} .upd-badge.drive{background:#e6f0e6;color:#1f7a4d}
  .upd-badge.auto{background:var(--paper-200);color:var(--fg3)}
  .upd-txt{font-size:13.5px;line-height:1.45;color:var(--fg1);word-break:break-word}

  .upd-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;flex-wrap:wrap}

  /* ── contexte marché & validation (depuis client_markets/client_contacts) ── */
  .mkt-empty{color:var(--fg3);font-size:13px;font-style:italic;padding:6px 2px}
  .mkt-card{background:var(--paper-50);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px}
  .mkt-card .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .mkt-card .mh .pill{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--orange-700)}
  .mkt-card .mh .pays{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--fg1)}
  .mkt-card .mh .best{font-family:var(--font-mono);font-size:9.5px;color:var(--success);font-weight:700}
  .mkt-row{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;margin:4px 0;align-items:start}
  .mkt-row .lbl{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);font-weight:700;padding-top:3px}
  .mkt-row .val{font-size:13px;color:var(--fg1);line-height:1.45}
  .mkt-chip{display:inline-block;font-size:11.5px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px 8px;margin:2px 4px 2px 0;color:var(--fg2)}

  .mkt-rule::before{content:"›";position:absolute;left:2px;color:var(--orange-500);font-weight:700}
  .mkt-contact{border-top:1px solid var(--border);padding-top:9px;margin-top:9px}
  .mkt-contact .cn{font-weight:700;font-size:13.5px;color:var(--fg1)} .mkt-contact .cr{font-size:12px;color:var(--fg3);margin-left:6px}
  .mkt-more{font-size:12px;color:var(--orange-600);font-weight:600;cursor:pointer;background:0;border:0;padding:7px 2px;font-family:inherit}
  .mkt-more:hover{text-decoration:underline}
  @media(max-width:680px){.mkt-row{grid-template-columns:1fr}.mkt-row .lbl{padding-top:0}}
  /* ── commentaires & observations (table public.comments) ── */
  .cmt-list{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
  .cmt-empty{color:var(--fg3);font-size:13.5px;font-style:italic;padding:4px 2px}
  .cmt{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;background:var(--paper-50);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
  .cmt.obs{background:color-mix(in srgb,var(--orange-500) 7%,var(--surface));border-color:color-mix(in srgb,var(--orange-500) 28%,var(--border))}
  .cmt .cav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--ink-900);color:#fff;flex:0 0 auto}
  .cmt.obs .cav{background:var(--orange-500)}
  .cmt-main{min-width:0}
  .cmt-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
  .cmt-who{font-weight:700;font-size:13.5px;color:var(--fg1)}
  .cmt-kind{font-family:var(--font-mono);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--paper-200);color:var(--fg2)}
  .cmt-kind.obs{background:color-mix(in srgb,var(--orange-500) 16%,#fff);color:var(--orange-700)}
  .cmt-when{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3)}
  .cmt-del{margin-left:auto;border:0;background:transparent;color:var(--fg4);cursor:pointer;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px}
  .cmt-del:hover{color:var(--danger);background:var(--paper-200)}
  .cmt-body{font-size:13.5px;line-height:1.5;color:var(--fg1);word-break:break-word;white-space:pre-wrap}
  .cmt-body a{color:var(--orange-600);font-weight:600}
  .cmt-add{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-top:11px}
  .cmt-kinds{display:flex;gap:6px;margin-bottom:9px}
  .cmt-kbtn{font:inherit;font-size:12.5px;font-weight:600;color:var(--fg2);background:var(--paper-50);border:1px solid var(--border);border-radius:999px;padding:5px 13px;cursor:pointer;transition:.12s}
  .cmt-kbtn.on{background:var(--ink-950);color:#F7F2EA;border-color:transparent}
  .cmt-add textarea{width:100%;min-height:62px;resize:vertical;font:inherit;font-size:14px;line-height:1.45;color:var(--fg1);background:var(--paper-50);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-sizing:border-box}
  .cmt-add textarea:focus{outline:2px solid var(--orange-400);border-color:transparent}
  .cmt-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
  .cmt-as{font-size:12px;color:var(--fg3)} .cmt-as b{color:var(--fg1)}
  /* personnes impliquées */
  .cmt-inv-lbl{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);margin:10px 0 6px}
  .cmt-inv{display:flex;flex-wrap:wrap;gap:6px}
  .cmt-ichip{font:inherit;font-size:12px;font-weight:600;color:var(--fg2);background:var(--paper-50);border:1px solid var(--border);border-radius:999px;padding:4px 11px;cursor:pointer;transition:.12s}
  .cmt-ichip:hover{border-color:var(--orange-300)}
  .cmt-ichip.on{background:var(--orange-500);color:var(--fg-on-orange,#fff);border-color:transparent}
  .cmt-itags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .cmt-itag{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:11px;font-weight:700;color:var(--orange-700);
    background:color-mix(in srgb,var(--orange-500) 12%,#fff);border:1px solid color-mix(in srgb,var(--orange-500) 26%,var(--border));border-radius:999px;padding:2px 9px}
  .cmt-itag:hover{background:color-mix(in srgb,var(--orange-500) 20%,#fff)}
  a.cmt-who{text-decoration:none} a.cmt-who:hover{text-decoration:underline}
</style>

<script>
"use strict";
/* ============================================================
   Tâche — page dédiée à UN dossier. URL : tache.html?code=<CODE>
   ============================================================ */
const clientCol = window.clientVar;
const STATUT_COL = window.STATUT_COL;
const TEAM=[];
const STATUT_OPTS=["Reçu","En cours","En attente client","Bloqué","Envoyé dans Slack","Livré","Validé","Bouclé","Frozen","Archivé"];
const DONE_STATUS=new Set(["Envoyé dans Slack","Livré","Livré (cycle)","Validé","Bouclé","Archivé"]);
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const normResp=r=>(r||"").trim();
const SOURCES=[{k:"Message",ic:"💬"},{k:"WhatsApp",ic:"🟢"},{k:"PowerPoint",ic:"📊"},{k:"Réunion",ic:"📅"},{k:"Mail",ic:"✉️"},{k:"Slack",ic:"#"},{k:"Drive",ic:"📁"},{k:"Autre",ic:"📎"}];

function srcClass(s){ s=(s||"").toLowerCase();
  if(/whats/.test(s))return"wa"; if(/slack/.test(s))return"sl"; if(/mail|e-?mail/.test(s))return"mail";
  if(/power|ppt/.test(s))return"ppt"; if(/r[ée]uni|meet/.test(s))return"meet"; if(/drive/.test(s))return"drive";
  if(/auto|backfill/.test(s))return"auto"; return""; }

function commTimeline(comm){
  if(!comm||!String(comm).trim()) return `<div class="upd-empty">Aucune mise à jour consignée. Ajoute la première ci-dessous.</div>`;
  const parts=String(comm).split(/\s·\s+/).map(s=>s.trim()).filter(Boolean);
  return parts.map(p=>{
    const dm=p.match(/(\d{4}-\d{2}-\d{2})/); const date=dm?dm[1]:"";
    let src=""; const sb=p.match(/\[([^\]]+)\]/);
    if(sb) src=sb[1];
    else { const m2=p.match(/\b(WhatsApp|Slack|Mail|Drive|PowerPoint|R[ée]union|backfill)\b/i); if(m2) src=m2[1]; }
    let text=p.replace(/^MAJ\s+\d{4}-\d{2}-\d{2}\s*/i,"").replace(/^\[[^\]]+\]\s*/,"").replace(/^[:：]\s*/,"").trim();
    if(!text) text=p;
    const linked=esc(text).replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">lien ↗</a>');
    return `<div class="upd-item"><div class="upd-meta">${date?`<span class="upd-date">${esc(date)}</span>`:""}${src?`<span class="upd-badge ${srcClass(src)}">${esc(String(src).slice(0,12))}</span>`:""}</div><div class="upd-txt">${linked}</div></div>`;
  }).join("");
}

const initials=n=>{const p=(n||"").trim().split(/\s+/);if(!p[0])return"";return((p[0][0]||"")+(p.length>1?(p[1][0]||""):"")).toUpperCase();};
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const docStat=s=>{const x=(s||"").toLowerCase();if(/valid|complet|présent|presente|finalis/.test(x))return"done";if(/brouillon|cours|infér|infer|dimensionn/.test(x))return"draft";return"todo";};
const DRIVE_ROOT=(window.SUPA&&window.SUPA.drive)||"";

function driveUrl(m){const code=(m.entree==="Maître")?m.ndeg:(m.parent||m.ndeg);if(DRIVE_ROOT)return DRIVE_ROOT.replace(/\{code\}/g,encodeURIComponent(code));return"https://drive.google.com/drive/search?q="+encodeURIComponent(code+" "+(m.projet||""));}

async function fetchText(p){const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const t=await r.text();
  const ct=(r.headers.get("content-type")||"").toLowerCase();
  if(ct.includes("text/html")||/^\s*(<!doctype html|<html[\s>])/i.test(t))throw new Error("HTTP 404");
  return t;}

const stripFM=md=>md.replace(/^﻿?---[\s\S]*?\n---\s*/,"");

function mdToHtml(s){if(!s)return"";const lines=String(s).split("\n");let out=[],inUl=false,tbl=null;
  const inline=t=>esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\frac{.+?}\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const isSep=c=>c.length&&c.every(x=>/^:?-{2,}:?$/.test(x.trim()));const closeUl=()=>{if(inUl){out.push("</ul>");inUl=false;}};
  const closeTbl=()=>{if(!tbl)return;let head=null,body=[];tbl.forEach((r,i)=>{if(isSep(r))return;if(head===null&&tbl[i+1]&&isSep(tbl[i+1]))head=r;else body.push(r);});
    const h=head?("<thead><tr>"+head.map(c=>"<th>"+inline(c.trim())+"</th>").join("")+"</tr></thead>"):"";out.push("<table class='md-tbl'>"+h+"<tbody>"+body.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>").join("")+"</tbody></table>");tbl=null;};
  for(const ln of lines){const t=ln.trim();
    if(t.startsWith("|")&&t.indexOf("|",1)>0){closeUl();(tbl=tbl||[]).push(t.replace(/^\|/,"").replace(/\|$/,"").split("|"));continue;}
    closeTbl();const h=t.match(/^(#{1,6})\s+(.*)$/);
    if(h){closeUl();const lv=Math.min(6,h[1].length+3);out.push("<h"+lv+" class='md-h'>"+inline(h[2])+"</h"+lv+">");continue;}
    if(/^[-•]\s+/.test(t)){if(!inUl){out.push("<ul>");inUl=true;}out.push("<li>"+inline(t.replace(/^[-•]\s+/,""))+"</li>");continue;}
    closeUl();if(/^>\s?/.test(t)){out.push("<blockquote>"+inline(t.replace(/^>\s?/,""))+"</blockquote>");continue;}
    if(t==="")continue;out.push("<p>"+inline(t)+"</p>");}
  closeUl();closeTbl();return out.join("");}

let ROWS=[], byNdeg={}, CODE="";
let _MKT=null, _CTC=null;

async function loadMarketCtx(m){
  const host=document.getElementById("market-ctx"); if(!host) return;
  if(!m || !m.client){ host.innerHTML='<div class="mkt-empty">Pas de client renseigné.</div>'; return; }
  host.innerHTML='<div class="mkt-empty">Chargement du contexte marché…</div>';
  try{ if(_MKT===null) _MKT=await loadMarkets(); if(_CTC===null) _CTC=await loadContacts(); }
  catch(e){ host.innerHTML='<div class="mkt-empty">Contexte marché indisponible (base).</div>'; return; }
  const markets=_MKT.filter(x=>x.client===m.client), contacts=_CTC.filter(x=>x.client===m.client);
  if(!markets.length && !contacts.length){ host.innerHTML=`<div class="mkt-empty">Aucun savoir marché en base pour ${esc(m.client)} — à enrichir depuis les chats.</div>`; return; }
  const txt=((m.projet||"")+" "+(m.marque||"")+" "+(m.pays||"")+" "+(m.cluster||"")).toLowerCase();
  const score=mk=>{ let s=0;
    if(mk.pays) mk.pays.toLowerCase().split(/[\/(),]/).map(w=>w.trim()).filter(w=>w.length>=4).forEach(w=>{ if(txt.includes(w.slice(0,5))) s+=3; });
    if(mk.marque){ const mm=mk.marque.toLowerCase(), tq=(m.marque||"").toLowerCase();
      if(tq.length>=3 && (mm.includes(tq.slice(0,5))||txt.includes(mm.split(/[\s(\/]/)[0]))) s+=4;
      if(/ombrelle|transverse|holding|group/.test(mm)) s+=1; }
    return s; };
  const ranked=markets.map(mk=>({mk,s:score(mk)})).sort((a,b)=>b.s-a.s);
  const arr=a=>Array.isArray(a)?a:[];
  const chips=(label,items)=> items&&items.length?`<div class="mkt-row"><span class="lbl">${label}</span><div class="val">${items.map(x=>`<span class="mkt-chip">${esc(x)}</span>`).join("")}</div></div>`:"";
  const rules=(label,items)=> items&&items.length?`<div class="mkt-row"><span class="lbl">${label}</span><div class="val">${items.map(x=>`<div class="mkt-rule">${esc(x)}</div>`).join("")}</div></div>`:"";
  const line=(label,v)=> v?`<div class="mkt-row"><span class="lbl">${label}</span><div class="val">${esc(v)}</div></div>`:"";
  const card=(r,relevant)=>{ const mk=r.mk; return `<div class="mkt-card">
    <div class="mh"><span class="pill">${esc(mk.marque||m.client)}</span>${mk.pays?`<span class="pays">${esc(mk.pays)}</span>`:""}${relevant?`<span class="best">● pertinent ici</span>`:""}</div>
    ${chips("Dimensions",arr(mk.dimensions))}${chips("SKU / offres",arr(mk.skus))}
    ${line("Signature",mk.signature)}${line("Langue",mk.langue)}${chips("Claims",arr(mk.claims))}
    ${rules("Spécificités",arr(mk.specificites))}</div>`; };
  const contactsHTML=()=> contacts.length?`<div class="dr-sect" style="margin-top:14px">Interlocuteurs — comment faire valider</div>`+
    contacts.map(c=>`<div class="mkt-contact"><div><span class="cn">${esc(c.nom)}</span><span class="cr">${esc(c.role||"")}</span></div>${arr(c.conditions_validation).slice(0,7).map(x=>`<div class="mkt-rule">${esc(x)}</div>`).join("")}</div>`).join(""):"";
  function paint(n){
    let h=ranked.slice(0,n).map((r,i)=>card(r, r.s>0 && i<2)).join("")+contactsHTML();
    if(ranked.length>n) h+=`<button class="mkt-more" id="mkt-more">+ voir les ${ranked.length-n} autre(s) marché(s) ${esc(m.client)}</button>`;
    host.innerHTML=h;
    const mr=document.getElementById("mkt-more"); if(mr) mr.onclick=()=>paint(ranked.length);
    if(window.lucide) window.lucide.createIcons();
  }
  paint(Math.max(1, ranked.filter(r=>r.s>0).slice(0,2).length));
}

/* ===== Commentaires & observations (table public.comments) =====
   Chacun commente avec son compte (currentActor : compte authentifié, sinon
   l'identité « qui es-tu » du bandeau). Observation = note mise en avant. */
let _CMT_KIND="comment";
const _CMT_INVOLVED=new Set();   // personnes impliquées sélectionnées pour le prochain commentaire
function isOwnerActor(){ const id=window.MTG_IDENTITY; return !id || id.role==="owner"; }
function cmtAgo(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  const s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return "à l'instant";
  const mn=Math.floor(s/60); if(mn<60) return "il y a "+mn+" min";
  const h=Math.floor(mn/60);  if(h<24) return "il y a "+h+" h";
  const j=Math.floor(h/24);   if(j<7)  return "il y a "+j+" j";
  return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
}
function ficheLink(name){ return "personne.html?nom="+encodeURIComponent(name); }
function cmtItem(c, actor){
  const obs=c.kind==="observation";
  const body=esc(c.body||"").replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">lien ↗</a>');
  const canDel = !!actor && (c.author===actor || isOwnerActor());
  const inv=Array.isArray(c.involved)?c.involved.filter(Boolean):[];
  const who=c.author?`<a class="cmt-who" href="${esc(ficheLink(c.author))}" title="Voir la fiche de ${esc(c.author)}">${esc(c.author)}</a>`:`<span class="cmt-who">—</span>`;
  return `<div class="cmt${obs?' obs':''}">
    <div class="cav">${esc(initials(c.author)||"?")}</div>
    <div class="cmt-main">
      <div class="cmt-hd">
        ${who}
        ${obs?'<span class="cmt-kind obs">observation</span>':''}
        <span class="cmt-when">${esc(cmtAgo(c.created_at))}</span>
        ${canDel?`<button class="cmt-del" data-del="${esc(String(c.id))}" title="Supprimer ce commentaire">supprimer</button>`:""}
      </div>
      <div class="cmt-body">${body}</div>
      ${inv.length?`<div class="cmt-itags">${inv.map(n=>`<a class="cmt-itag" href="${esc(ficheLink(n))}" title="Voir la fiche de ${esc(n)}">👤 ${esc(n)}</a>`).join("")}</div>`:""}
    </div>

}
async function renderComments(ndeg){
  const box=document.getElementById("comments-box"); if(!box) return;
  if(window.SUPA_SOURCE!=="supabase" || !window.loadComments){
    box.innerHTML='<div class="cmt-empty">Commentaires disponibles uniquement en ligne (base live).</div>'; return;
  }
  const actor=(window.currentActor&&currentActor())||"";
  let list=[];
  try{ list=await loadComments(ndeg); }
  catch(e){ box.innerHTML='<div class="cmt-empty">Commentaires indisponibles (base).</div>'; return; }
  const listHTML = list.length
    ? `<div class="cmt-list">${list.map(c=>cmtItem(c,actor)).join("")}</div>`
    : `<div class="cmt-empty">Aucun commentaire pour l'instant. Ouvre la discussion ci-dessous.</div>`;
  const team=(window.teamFrom?teamFrom(ROWS):[]);
  const involvedChips=team.map(n=>`<button type="button" class="cmt-ichip${_CMT_INVOLVED.has(n)?' on':''}" data-inv="${esc(n)}">${esc(n)}</button>`).join("");
  const composer = `<div class="cmt-add">
    <div class="cmt-kinds">
      <button type="button" class="cmt-kbtn${_CMT_KIND==='comment'?' on':''}" data-kind="comment">💬 Commentaire</button>
      <button type="button" class="cmt-kbtn${_CMT_KIND==='observation'?' on':''}" data-kind="observation">👁 Observation</button>

    <textarea id="cmt-text" placeholder="Ton commentaire ou ton observation sur cette tâche…"></textarea>
    <div class="cmt-inv-lbl">Personnes impliquées <span style="text-transform:none;font-weight:400">— traçables sur leur fiche</span></div>

    <div class="cmt-foot">
      <span class="cmt-as">${actor?`Tu publies en tant que <b>${esc(actor)}</b>`:`<span style="color:var(--danger)">Choisis ton nom (bouton en haut à droite) pour commenter.</span>`}</span>
      <button class="dr-btn primary" id="cmt-send"${actor?"":" disabled"}><i data-lucide="send" style="width:14px;height:14px"></i>Publier</button>
    </div></div>`;
  box.innerHTML=listHTML+composer;
  if(window.lucide) window.lucide.createIcons();
  box.querySelectorAll(".cmt-kbtn").forEach(b=>b.onclick=()=>{ _CMT_KIND=b.dataset.kind; box.querySelectorAll(".cmt-kbtn").forEach(x=>x.classList.toggle("on",x===b)); });
  box.querySelectorAll(".cmt-ichip").forEach(b=>b.onclick=()=>{ const n=b.dataset.inv; if(_CMT_INVOLVED.has(n)) _CMT_INVOLVED.delete(n); else _CMT_INVOLVED.add(n); b.classList.toggle("on"); });
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Supprimer ce commentaire ?")) return;
    try{ await deleteComment(b.dataset.del); renderComments(ndeg); }
    catch(e){ flash("Échec de la suppression","err"); }
  });
  const send=document.getElementById("cmt-send");
  if(send) send.onclick=async()=>{
    const body=(document.getElementById("cmt-text").value||"").trim();
    if(!body){ flash("Écris un commentaire d'abord","warn"); return; }
    if(!actor){ flash("Choisis ton nom (bouton en haut à droite) pour commenter","warn"); return; }
    send.disabled=true;

    try{ await addComment({ndeg, author:actor, body, kind:_CMT_KIND, involved}); _CMT_INVOLVED.clear(); flash("✓ Publié","ok"); renderComments(ndeg); }
    catch(e){ send.disabled=false; flash("Échec : "+((e&&e.message)||e),"err"); }
  };
}

  }
  document.querySelectorAll(".doc-chip").forEach(c=>c.onclick=()=>loadDoc(c.dataset.file));
  loadDoc("BRIEF.md");
  loadMarketCtx(m);
  renderComments(m.ndeg);
}

async function boot(){
  try{ ROWS=await loadBriefsLive(); }catch(e){ ROWS=[]; }
  byNdeg={}; ROWS.forEach(m=>byNdeg[m.ndeg]=m);
  render();
  if(window.sourceBanner) sourceBanner();
  $("#back").onclick=e=>{ e.preventDefault(); if(history.length>1) history.back(); else location.href="entrees.html"; };
  { const pr=$("#present"), c=getCode(); if(pr&&c) pr.href="gabarits.html?code="+encodeURIComponent(c); }
  window.addEventListener("hashchange",render);
  if(window.lucide)window.lucide.createIcons();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>

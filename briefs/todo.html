<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("matanga:theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matanga — Ma journée</title>
<link rel="stylesheet" href="colors_and_type.css?v=20260630">
<style>
  :root{
    --c-cad:#FF6A14;--c-frc:#2D6BD4;--c-eco:#1F9D63;--c-bel:#E23D2E;--c-nsi:#9A3F57;
    --c-sof:#8F3208;--c-dan:#3E8FA8;--c-dlf:#C2440A;--c-trx:#5E6B30;--c-flo:#B07A1E;
    --c-fok:#7C5026;--c-other:#9A8F80;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-text,'Hanken Grotesk',system-ui,sans-serif);
    background:
      radial-gradient(1100px 640px at 90% -10%, var(--bg-app-warm) 0%, transparent 58%),
      var(--bg-app);
    color:var(--fg1);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .shell{max-width:880px;margin:0 auto;padding:22px 28px 110px}   /* colonne étroite = lecture calme */

  /* ── en-tête personnel ── */
  .hero{margin:30px 2px 8px}
  .hero .hi{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--fg3)}
  .hero h1{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.04;
    letter-spacing:var(--tracking-tight);margin:7px 0 0}
  .hero h1 em{font-style:normal;color:var(--orange-600)}
  .hero .line{margin:9px 0 0;color:var(--fg2);font-size:14.5px}
  .hero .line b{color:var(--fg1);font-weight:700}

  /* ── bandeau métriques : anneau du jour + série ── */
  .pulse{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:20px 0 6px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg,18px);padding:16px 20px;box-shadow:var(--shadow-sm)}
  .ring{position:relative;width:62px;height:62px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--fg1);font-feature-settings:'tnum' 1}
  .pulse .pt{flex:1;min-width:160px}
  .pulse .pt .t{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--fg1)}
  .pulse .pt .s{font-size:13px;color:var(--fg2);margin-top:2px}
  .streak{display:flex;align-items:center;gap:11px;border-left:1px solid var(--border);padding-left:18px;flex:0 0 auto}
  .streak .flame{font-size:26px;line-height:1;filter:saturate(1.1)}
  .streak.cold .flame{filter:grayscale(1);opacity:.5}
  .streak .sv{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1;color:var(--orange-600);font-feature-settings:'tnum' 1}
  .streak.cold .sv{color:var(--fg3)}
  .streak .sl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);margin-top:3px}
  @media(max-width:560px){ .streak{border-left:0;padding-left:0;width:100%} }

  /* ── contrôle identité + (manager) recherche ── */
  .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 2px 2px}
  .me-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--orange-300);
    background:var(--accent-soft,#fff4ec);color:var(--orange-700);font:inherit;font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:var(--radius-pill);cursor:pointer;transition:.13s;white-space:nowrap}
  .me-pill:hover{border-color:var(--orange-500)}
  .me-pill .who{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    background:var(--orange-500);color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
  .me-pill .chg{font-weight:600;color:var(--fg3);font-size:11.5px}
  .me-pill.empty{border-color:var(--border);background:var(--surface);color:var(--fg2)}
  .me-pill.empty .who{background:var(--ink-900)}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:9px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-pill);padding:9px 15px}
  .search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;width:100%;color:var(--fg1)}
  .search svg{color:var(--fg3);flex:0 0 auto}
  .ghost{border:0;background:transparent;color:var(--fg3);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
  .ghost:hover{color:var(--orange-600)}

  /* ── focus : ce qui ne peut pas attendre ── */
  .focus{margin:24px 0 6px}
  .focus .ft{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--orange-600);font-weight:700;margin:0 2px 11px}
  .fcard{display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;
    background:var(--surface);border:1px solid var(--orange-300);border-left:4px solid var(--orange-500);
    border-radius:var(--radius-lg,16px);padding:16px 19px;box-shadow:0 6px 22px rgba(214,106,20,.10);margin-bottom:10px;transition:.13s}
  .fcard:hover{box-shadow:0 10px 30px rgba(214,106,20,.16)}
  .fcard .ft-main{min-width:0;cursor:pointer}
  .fcard .ft-t{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.2;color:var(--fg1);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fcard .ft-s{font-size:12.5px;color:var(--fg2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fcard .ft-s .why{color:var(--danger);font-weight:700}

  /* ── sections temporelles ── */
  .sec{margin:26px 0 2px;display:flex;align-items:baseline;gap:12px}
  .sec h2{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:var(--tracking-snug);margin:0}
  .sec .accent{width:8px;height:8px;border-radius:50%;flex:0 0 auto;align-self:center}
  .sec .gline{flex:1;height:1px;background:var(--border)}
  .sec .gn{font-family:var(--font-mono);font-size:11px;color:var(--fg3);white-space:nowrap}
  .sec.s-late h2{color:var(--danger)} .sec.s-late .accent{background:var(--danger)}
  .sec.s-today .accent{background:var(--orange-500)}
  .sec.s-tom .accent{background:var(--st-frozen,#6FA1B8)}
  .sec.s-later .accent{background:var(--fg4,#b9ad9c)}
  .sec.s-noplan .accent{background:var(--fg4,#b9ad9c)}

  .rows{display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md,12px);
    padding:13px 16px;transition:border-color .13s,box-shadow .13s,opacity .15s}
  .row:hover{border-color:var(--orange-300);box-shadow:0 4px 16px rgba(40,30,18,.05)}
  .row.done{opacity:.4}
  .row.done .pt{text-decoration:line-through}
  .check{width:23px;height:23px;border-radius:7px;border:1.8px solid var(--border-strong);background:var(--paper-50);cursor:pointer;
    display:grid;place-items:center;color:transparent;flex:0 0 auto;transition:.12s}
  .check:hover{border-color:var(--orange-400)}
  .row.done .check{background:var(--success);border-color:var(--success);color:#fff}
  .main{min-width:0;cursor:pointer;display:flex;align-items:center;gap:11px}
  .cdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .info{min-width:0}
  .info .pt{font-weight:600;font-size:14.5px;line-height:1.25;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .ps{font-size:12px;color:var(--fg3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .ps2{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
  .info .ps2 b{color:var(--fg2);font-weight:600} .info .ps2 .hard{color:var(--orange-600);font-weight:700}
  .info .ps2 .sep{opacity:.4;margin:0 3px}
  .meta{display:flex;gap:7px;align-items:center;flex:0 0 auto}
  .tag{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:var(--radius-pill);text-transform:uppercase;white-space:nowrap}
  .tag.late{background:var(--danger);color:#fff}
  .tag.p0{background:var(--orange-500);color:var(--fg-on-orange,#fff)}
  .tag.block{background:var(--ink-950);color:#fff}
  .tag.wait{background:var(--orange-50,#fff4ec);color:var(--orange-700)}
  .tag.dl{background:var(--paper-100);color:var(--fg2)}
  .shared{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--fg2);background:var(--paper-100);padding:1px 6px;border-radius:var(--radius-pill)}

  /* manager : petite étiquette responsable (lecture seule ici, réattribution sur la fiche) */
  .who-tag{font-size:12px;color:var(--fg2);font-weight:600;white-space:nowrap}

  /* ── identité picker ── */
  .picker-bd{position:fixed;inset:0;z-index:99998;background:rgba(20,14,8,.46);display:none;align-items:center;justify-content:center;padding:20px}
  .picker-bd.show{display:flex}
  .picker{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl,18px);
    box-shadow:0 24px 70px rgba(30,20,10,.34);max-width:480px;width:100%;max-height:86vh;overflow:auto;padding:26px 24px 22px}
  .picker h2{font-family:var(--font-display);font-weight:600;font-size:23px;margin:0 0 4px}
  .picker p{margin:0 0 18px;color:var(--fg2);font-size:14px}
  .picker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .pk{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--paper-50);
    color:var(--fg1);font:inherit;font-size:14.5px;font-weight:600;padding:13px 14px;border-radius:var(--radius-md);cursor:pointer;text-align:left;transition:.12s;min-height:48px}
  .pk:hover{border-color:var(--orange-400);background:var(--accent-soft);color:var(--orange-700)}
  .pk .av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--ink-900);color:#fff;font-size:12px;font-weight:800;flex:0 0 auto}
  .picker-foot{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:15px}
  .pk-mgr{flex:1;min-width:200px;justify-content:flex-start}
  .pk-mgr .av{background:var(--orange-500)}
  .picker-close{border:0;background:transparent;color:var(--fg3);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
  @media (max-width:560px){ .picker-grid{grid-template-columns:1fr} }

  /* ── cockpit manager ── */
  .cockpit{margin:18px 0 8px;display:flex;flex-direction:column;gap:10px}
  .ck-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);font-weight:700;margin-bottom:2px}
  .ck-links{display:flex;flex-wrap:wrap;gap:7px}
  .ck-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg2);
    border:1px solid var(--border);border-radius:var(--radius-pill);padding:7px 13px;text-decoration:none;transition:.12s;white-space:nowrap}
  .ck-link:hover{border-color:var(--orange-400);color:var(--orange-600);background:var(--accent-soft)}
  .ck-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .ckp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:10px 12px;cursor:pointer;transition:.12s;text-align:left;width:100%}
  .ckp:hover{border-color:var(--orange-300);box-shadow:var(--shadow-sm)}
  .ckp.ck-late{border-color:var(--danger)}
  .ckp .ckav{width:34px;height:34px;border-radius:9px;background:var(--ink-950);color:#fff;
    display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;flex:0 0 auto}
  .ckp.ck-late .ckav{background:var(--danger)}
  .ckp .cki{flex:1;min-width:0}
  .ckp .ckn{font-weight:600;font-size:13px;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ckp .cks{font-size:10.5px;color:var(--fg3);margin-top:1px;font-family:var(--font-mono)}
  .ckp .ck-badge{font-size:10px;font-weight:700;color:var(--danger);background:var(--danger-bg);
    border-radius:5px;padding:2px 5px;margin-left:auto;flex:0 0 auto}
  @media(max-width:560px){.ck-people{grid-template-columns:1fr 1fr}}

  /* ── état vide / sérénité ── */
  .allclear{text-align:center;padding:48px 20px 30px}
  .allclear .big{font-family:var(--font-display);font-weight:500;font-size:30px;color:var(--success);letter-spacing:var(--tracking-tight)}
  .allclear .sm{color:var(--fg2);font-size:14.5px;margin-top:8px}
  .empty{text-align:center;color:var(--fg3);padding:40px 20px;font-size:14.5px}
  .src{font-family:var(--font-mono);font-size:10.5px;color:var(--fg4);margin-top:26px;text-align:right}

  @media (max-width:760px){
    .shell{padding:18px 16px 80px}
    .row{grid-template-columns:auto 1fr;grid-auto-rows:auto;row-gap:8px}
    .meta{grid-column:1/-1;flex-wrap:wrap}
    .fcard{grid-template-columns:auto 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">

  <div id="mtg-top" data-page="todo" data-sub="ma journée"></div>

  <div class="hero">
    <div class="hi" id="hi">— · —</div>
    <h1 id="h1">Ma <em>journée</em></h1>
    <div class="line" id="line">Chargement…</div>
  </div>

  <div class="pulse" id="pulse" hidden>
    <div class="ring" id="ring"></div>
    <div class="pt"><div class="t" id="pulse-t">—</div><div class="s" id="pulse-s">—</div></div>
    <div class="streak" id="streak" hidden></div>
  </div>

  <div class="ctl">
    <button class="me-pill empty" id="me-pill" type="button" title="Choisir qui tu es"></button>
    <label class="search" id="searchwrap" hidden>
      <i data-lucide="search" style="width:16px;height:16px"></i>
      <input id="search" type="text" placeholder="Filtrer…">
    </label>
    <button class="ghost" id="toggle-done" type="button">Voir les faits</button>
  </div>

  <div id="cockpit" hidden></div>
  <div id="list"></div>
  <div class="src" id="src"></div>

</div>

<div class="picker-bd" id="picker-bd" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="picker">
    <h2 id="picker-title">C'est qui ?</h2>
    <p>Choisis ton nom : tu ne verras que <b>tes tâches</b>. L'écran s'en souvient — mets-le en favori, rouvre-le chaque matin.</p>
    <div class="picker-grid" id="picker-grid"></div>
    <div class="picker-foot">
      <button class="pk pk-mgr" id="pk-manager" type="button"><span class="av">★</span><span>Je suis le manager — tout voir</span></button>
      <button class="picker-close" id="picker-close" type="button">Plus tard</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@1.21.0"></script>
<script src="supa.js?v=20260639"></script>
<script src="ui.js?v=20260639"></script>
<script src="chrome.js?v=20260637"></script>
<script>
"use strict";
/* ============================================================
   Ma journée — écran d'accueil par personne (INFJ : clarté avant tout).
   Hiérarchie mentale unique, de gauche à droite du temps :
     Focus (ne peut pas attendre) → En retard (hier) → Aujourd'hui
     → Demain → Plus tard → Sans échéance.
   + anneau de complétion du jour + série de jours tenus (ponctualité).
   Plumbing identité / live / clôture conservé du tracker.
   ============================================================ */

const clientCol = window.clientVar;
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtD = iso => { if(!/^\d{4}-\d{2}-\d{2}/.test(iso||"")) return ""; const d=new Date(String(iso).slice(0,10)+"T00:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]; };
let BENCH = {byType:{},overall:7};   // étalon agence (délai par type), recalculé au render

const TODAY = new Date(new Date().toDateString());
const DAY = 864e5;
const DONE_STATUS = new Set(["Envoyé dans Slack","Livré","Livré (cycle)","Validé","Bouclé","Archivé"]);
const DEAD_STATUS = new Set(["Bouclé","Archivé","Frozen"]);   // hors « ma journée » (Frozen = gelé, sur gel.html)
const normResp = r => (r||"").replace(/Dérick/g,"Derick").trim();
const dStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const hasDL = m => /^\d{4}-\d{2}-\d{2}$/.test(m.deadline||"");
const effDone = m => DONE_STATUS.has(m.statut) || (m.closedAt && String(m.closedAt).length>=4);
const dlDate = m => new Date(m.deadline+"T00:00:00");
const isLate = m => hasDL(m) && !effDone(m) && dlDate(m) < TODAY;
const daysLate = m => Math.round((TODAY-dlDate(m))/DAY);
const daysTo = m => Math.round((dlDate(m)-TODAY)/DAY);
const onTime = m => effDone(m) && (!m.closedAt || String(m.closedAt).slice(0,10) <= (m.deadline||""));

const state = { q:"", resp:"", showDone:false };
let ALL=[], BYNDEG={};
let URL_OVERRIDE="";
const initial = s => ((s||"").trim().charAt(0).toUpperCase() || "?");

function isActionable(m){
  if(m.entree==="Doublon" || (m.ndeg||"").charAt(0)==="≈") return false;
  if(DEAD_STATUS.has(m.statut)) return false;
  return true;
}
function mine(m){                                  // périmètre de la personne (ou tout si manager/none)
  if(!state.resp) return true;
  return ownsTask(m.responsable, state.resp);
}
function passQ(m){
  const q=state.q.toLowerCase().trim(); if(!q) return true;
  return (m.ndeg+" "+m.projet+" "+m.marque+" "+m.client+" "+m.responsable+" "+m.livrables+" "+m.comm).toLowerCase().includes(q);
}

/* bucket temporel exclusif */
function bucket(m){
  if(isLate(m)) return "late";
  if(!hasDL(m)) return "noplan";
  const dt=daysTo(m);
  if(dt<=0) return "today";
  if(dt===1) return "tom";
  return "later";
}
/* urgence « focus » : ce qui ne peut pas attendre */
function urgScore(m){
  let s=0;
  if(isLate(m)) s+=100+Math.min(daysLate(m),60);
  if(m.prio==="P0") s+=70;
  if(bucket(m)==="today") s+=30;
  if(isDepBlocked(m,BYNDEG)) s-=200;   // bloqué par une dépendance → pas un focus actionnable
  return s;
}

function note(m){
  let s=(m.livrables||"").trim();
  if(!s){ s=(m.comm||"").replace(/\[t[aâ]che\]/ig,"").replace(/·\s*MAJ[^·]*$/,"").trim(); }
  if(s.length>90) s=s.slice(0,88)+"…";
  return s;
}
function whyUrgent(m){
  if(isLate(m)) return `En retard de ${daysLate(m)} jour${daysLate(m)>1?"s":""}`;
  if(m.prio==="P0" && bucket(m)==="today") return "P0 · dû aujourd'hui";
  if(m.prio==="P0") return "Priorité absolue (P0)";
  if(bucket(m)==="today") return "Dû aujourd'hui";
  return "";
}
function dlTag(m){
  if(isLate(m)) return `<span class="tag late">Hier · ${daysLate(m)}j</span>`;
  const b=bucket(m);
  if(b==="today") return `<span class="tag dl">aujourd'hui</span>`;
  if(b==="tom") return `<span class="tag dl">demain</span>`;
  if(b==="later" && hasDL(m)) return `<span class="tag dl">${esc(dlDate(m).getDate()+" "+MONTHS[dlDate(m).getMonth()])}</span>`;
  return "";
}
function tags(m){
  const t=[];
  const d=dlTag(m); if(d) t.push(d);
  if(m.prio==="P0") t.push(`<span class="tag p0">P0</span>`);
  if(m.statut==="Bloqué") t.push(`<span class="tag block">Bloqué</span>`);
  else if(m.statut==="En attente client") t.push(`<span class="tag wait">Attente client</span>`);
  if(isDepBlocked(m,BYNDEG)){ const bs=depBlockers(m,BYNDEG); t.push(`<span class="tag block" title="En attente de : ${esc(bs.map(x=>x.ndeg).join(', '))}">🔒 ${esc(bs[0].ndeg)}</span>`); }
  return t.join("");
}

function rowHTML(m){
  const done=effDone(m);
  const sub=[m.marque,m.client].filter(Boolean).join(" · ");
  const nt=note(m);
  const mgrWho = (!state.resp && m.responsable) ? `<span class="who-tag">${esc(normResp(m.responsable).split(/[\/&]/)[0].trim())}${isShared(m.responsable)?" +":""}</span>` : "";
  // bande enrichie : type de livrable · entrée → sortie déclarée (hard) → sortie agence · demandeur → responsable
  const resp=normResp(m.responsable).split(/[\/&]/)[0].trim();
  const dem=(m.entrePar||"").trim();
  const din=fmtD(m.date);
  const ddue=fmtD(m.deadline);
  const real=(window.realisticDeadlineISO?realisticDeadlineISO(m,BENCH):"");
  const dout=done?fmtD(m.closedAt):fmtD(real);
  const sep=`<span class="sep">·</span>`;
  const facts=[
    m.type?`<b>${esc(m.type)}</b>`:"",
    din?`entrée ${esc(din)}`:"",
    ddue?`dû ${esc(ddue)}${m.deadlineHard?` <span class="hard" title="hard-deadline exigée client">⚑</span>`:""}`:"",
    dout?`${done?"livré":"agence"} ${esc(dout)}`:"",
    (dem||resp)?`${esc(dem||"—")} → <b>${esc(resp||"—")}</b>`:""
  ].filter(Boolean).join(sep);
  // excerpt de brief pour le hover (depuis la base : livrables + contexte)
  const ex=[ m.type?`Type : ${m.type}`:"", m.livrables?`Livrables : ${m.livrables}`:"",
    m.comm?String(m.comm).replace(/\s+/g," ").slice(0,220):"" ].filter(Boolean).join("  —  ") || (m.projet||"");
  const inspBtn = (window.isCreativeTask && window.isCreativeTask(m)) ? `<button type="button" class="mtg-insp-trigger" onclick="event.stopPropagation(); window.showGlobalInspiration('${esc(m.ndeg)}')" title="Inspiration & Concept Concepteur Rédacteur" style="background:transparent; border:none; cursor:pointer; font-size:14px; padding:2px; margin-left:6px; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; transition:transform 0.15s ease;" onmouseover="this.style.transform='scale(1.25)'" onmouseout="this.style.transform='scale(1)'">💡</button>` : "";
  return `<div class="row${done?' done':''}" data-nd="${esc(m.ndeg)}">
    <button class="check" data-check="${esc(m.ndeg)}" title="${done?'Rouvrir':'Marquer fait'}" aria-label="Marquer fait"><i data-lucide="check" style="width:13px;height:13px"></i></button>
    <div class="main" data-open="${esc(m.ndeg)}" title="${esc(ex)}">
      <span class="cdot" style="background:${clientCol(m.client)}"></span>
      <div class="info">
        <div class="pt">${esc(m.projet)||"<i>sans titre</i>"}</div>
        <div class="ps">${esc(sub)}${nt?` · ${esc(nt)}`:""}</div>
        ${facts?`<div class="ps2">${facts}</div>`:""}
      </div>
    </div>
    <div class="meta">${tags(m)}${mgrWho}${inspBtn}</div>
  </div>`;
}
function focusHTML(m){
  const sub=[m.marque,m.client].filter(Boolean).join(" · ");
  const inspBtn = (window.isCreativeTask && window.isCreativeTask(m)) ? `<button type="button" class="mtg-insp-trigger" onclick="event.stopPropagation(); window.showGlobalInspiration('${esc(m.ndeg)}')" title="Inspiration & Concept Concepteur Rédacteur" style="background:transparent; border:none; cursor:pointer; font-size:14px; padding:2px; margin-left:6px; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; transition:transform 0.15s ease;" onmouseover="this.style.transform='scale(1.25)'" onmouseout="this.style.transform='scale(1)'">💡</button>` : "";
  return `<div class="fcard" data-nd="${esc(m.ndeg)}">
    <button class="check" data-check="${esc(m.ndeg)}" title="Marquer fait" aria-label="Marquer fait"><i data-lucide="check" style="width:13px;height:13px"></i></button>
    <div class="ft-main" data-open="${esc(m.ndeg)}">
      <div class="ft-t">${esc(m.projet)||"<i>sans titre</i>"}</div>
      <div class="ft-s"><span class="why">${esc(whyUrgent(m))}</span>${sub?` · ${esc(sub)}`:""}${(!state.resp&&m.responsable)?` · ${esc(normResp(m.responsable).split(/[\/&]/)[0].trim())}`:""}</div>
    </div>
    <div class="meta">${m.prio==="P0"?'<span class="tag p0">P0</span>':""}${inspBtn}</div>
  </div>`;
}

const SECTIONS=[
  {key:"late",  cls:"s-late",  label:"En retard — attendu hier"},
  {key:"today", cls:"s-today", label:"Aujourd'hui"},
  {key:"tom",   cls:"s-tom",   label:"Avant demain"},
  {key:"later", cls:"s-later", label:"Ce qui arrive après"},
  {key:"noplan",cls:"s-noplan",label:"Sans échéance — à planifier"},
];

/* anneau de complétion du jour (dû aujourd'hui : fait / total) */
function ringSVG(pct){
  const r=26, c=2*Math.PI*r, off=c*(1-pct/100);
  const col = pct>=100?"var(--success)":pct>=50?"var(--orange-500)":"var(--fg4,#b9ad9c)";
  return `<svg width="62" height="62" viewBox="0 0 62 62">
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/>
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg>`;
}
/* série de jours « tenus » = jours consécutifs (avec travail dû) tous livrés à temps */
function computeStreak(tasks){
  const byDay={};
  tasks.forEach(m=>{ if(hasDL(m)) (byDay[m.deadline]=byDay[m.deadline]||[]).push(m); });
  let streak=0; const todayStr=dStr(TODAY);
  for(let i=0;i<90;i++){
    const ds=dStr(new Date(TODAY.getTime()-i*DAY));
    const due=byDay[ds];
    if(!due) continue;                       // pas de travail dû ce jour → pont neutre
    const allOnTime=due.every(onTime);
    if(ds===todayStr){ if(allOnTime) streak++; continue; }   // aujourd'hui incomplet ne casse pas (journée en cours)
    if(allOnTime) streak++; else break;
  }
  return streak;
}

function renderPulse(scope){
  const dueToday=scope.filter(m=>hasDL(m) && dStr(dlDate(m))===dStr(TODAY));
  const doneToday=dueToday.filter(effDone).length;
  const pct=dueToday.length?Math.round(doneToday/dueToday.length*100):(scope.some(m=>!effDone(m))?0:100);
  const pulse=$("#pulse"); pulse.hidden=false;
  $("#ring").innerHTML=ringSVG(dueToday.length?pct:( /* rien dû aujourd'hui */ 100));
  $("#ring").insertAdjacentHTML("beforeend",`<div class="pct">${dueToday.length?pct+"%":"—"}</div>`);
  if(dueToday.length){
    $("#pulse-t").textContent=`${doneToday}/${dueToday.length} fait${doneToday>1?"s":""} aujourd'hui`;
    $("#pulse-s").textContent=pct>=100?"Journée tenue. Tout ce qui était dû est livré.":`Reste ${dueToday.length-doneToday} à livrer aujourd'hui.`;
  } else {
    $("#pulse-t").textContent="Rien d'échu aujourd'hui";
    $("#pulse-s").textContent="Avance sur ce qui arrive — ou souffle.";
  }
  // série : personnelle (membre) OU série équipe (manager qui valide les todos du staff)
  const stEl=$("#streak");
  const team=!state.resp;                          // manager / vue large → série d'équipe
  const n=computeStreak(scope);
  stEl.hidden=false; stEl.className="streak"+(n?"":" cold");
  stEl.innerHTML=`<span class="flame">${n?"🔥":"🌱"}</span><div><div class="sv">${n}</div><div class="sl">${team?"jours équipe tenus":("jour"+(n>1?"s":"")+" tenu"+(n>1?"s":""))}</div></div>`;
  stEl.title=team
    ? "Ton rôle de manager : valide ce que ton staff a livré. Série = jours consécutifs où TOUT le travail dû de l'équipe a été tenu (closed_at ≤ deadline)."
    : "Jours consécutifs où tout ton travail dû a été livré à temps (closed_at ≤ deadline).";
}

function renderCockpit(){
  const ck=$("#cockpit");
  if(state.resp||!ALL.length){ck.hidden=true;return;}
  ck.hidden=false;
  const weekAgo=dStr(new Date(TODAY.getTime()-7*DAY));
  const splitO=r=>(r||"").split(/[,/+&]|\bet\b/).map(s=>s.trim()).filter(s=>s&&!/réunion|stand.?by|à programmer/i.test(s));
  const map=new Map();
  ALL.filter(m=>m.entree!=="Doublon"&&(m.ndeg||"").charAt(0)!=="≈").forEach(m=>{
    splitO(m.responsable).forEach(name=>{
      if(!name)return;
      if(!map.has(name))map.set(name,{active:0,late:0,done:0});
      const p=map.get(name);
      if(isActionable(m)&&!effDone(m)){p.active++;if(isLate(m))p.late++;}
      else if(effDone(m)&&m.closedAt&&String(m.closedAt).slice(0,10)>=weekAgo)p.done++;
    });
  });
  const people=[...map.entries()].filter(([,p])=>p.active+p.done>0)
    .sort(([,a],[,b])=>b.late-a.late||b.active-a.active)
    .map(([name,p])=>({name,active:p.active,late:p.late,done:p.done}));
  ck.innerHTML=`
<div class="ck-label">Équipe — cette semaine</div>
<div class="ck-people">${people.map(p=>`<button class="ckp${p.late?" ck-late":""}" onclick="pickMe(${JSON.stringify(p.name)})">
  <div class="ckav">${esc(p.name.trim().charAt(0).toUpperCase())}</div>
  <div class="cki">
    <div class="ckn">${esc(p.name.split(" ")[0])}</div>
    <div class="cks">${p.active} actif${p.done?` · ${p.done} bouclé`:""}</div>
  </div>
  ${p.late?`<span class="ck-badge">${p.late}↓</span>`:""}
</button>`).join("")}</div>
<div class="ck-links">
  <a class="ck-link" href="equipe.html"><i data-lucide="users" style="width:13px;height:13px"></i>Vue équipe</a>
  <a class="ck-link" href="rapport.html"><i data-lucide="bar-chart-3" style="width:13px;height:13px"></i>Rapport</a>
  <a class="ck-link" href="bilan.html"><i data-lucide="calendar-check" style="width:13px;height:13px"></i>Bilan</a>
  <a class="ck-link" href="rh/evaluation-departement.html"><i data-lucide="user-check" style="width:13px;height:13px"></i>Évaluation</a>
</div>`;
  lucideGo();
}

function render(){
  BENCH=(window.leadBenchmark?leadBenchmark(ALL):BENCH);
  const scope=ALL.filter(m=>isActionable(m)&&mine(m)&&passQ(m));
  const open=scope.filter(m=>!effDone(m));
  renderPulse(scope);
  renderCockpit();

  // focus : top 3 « ne peut pas attendre » (retard ou P0, non bloqués par dépendance)
  const focus=open.filter(m=>(isLate(m)||m.prio==="P0")&&!isDepBlocked(m,BYNDEG))
    .sort((a,b)=>urgScore(b)-urgScore(a)).slice(0,3);
  const focusSet=new Set(focus.map(m=>m.ndeg));

  let html="";
  if(focus.length){
    html+=`<div class="focus"><div class="ft">Ton focus — maintenant</div>${focus.map(focusHTML).join("")}</div>`;
  }

  const rest=open.filter(m=>!focusSet.has(m.ndeg));
  let shown=focus.length;
  for(const s of SECTIONS){
    let arr=rest.filter(m=>bucket(m)===s.key);
    if(!arr.length) continue;
    arr.sort((a,b)=>{
      if(s.key==="late") return dlDate(a)-dlDate(b);
      if(s.key==="later") return dlDate(a)-dlDate(b);
      const pr=p=>({P0:0,P1:1,P2:2,P3:3}[p]??2);
      if(pr(a.prio)!==pr(b.prio)) return pr(a.prio)-pr(b.prio);
      return (a.ndeg||"").localeCompare(b.ndeg||"",undefined,{numeric:true});
    });
    shown+=arr.length;
    html+=`<div class="sec ${s.cls}"><span class="accent"></span><h2>${esc(s.label)}</h2><span class="gline"></span><span class="gn">${arr.length}</span></div>`;
    html+=`<div class="rows">${arr.map(rowHTML).join("")}</div>`;
  }

  // faits (option)
  if(state.showDone){
    const dn=scope.filter(effDone).sort((a,b)=>String(b.closedAt).localeCompare(String(a.closedAt)));
    if(dn.length){
      html+=`<div class="sec"><span class="accent" style="background:var(--success)"></span><h2 style="color:var(--success)">Faits</h2><span class="gline"></span><span class="gn">${dn.length}</span></div>`;
      html+=`<div class="rows">${dn.map(rowHTML).join("")}</div>`;
    }
  }

  if(!shown){
    html+=`<div class="allclear"><div class="big">Rien ne presse ✓</div><div class="sm">Tu es à jour sur tout ce qui compte. Profite, ou prends de l'avance.</div></div>`;
  }
  $("#list").innerHTML=html; lucideGo();

  // ligne d'intro
  const late=open.filter(isLate).length, tod=open.filter(m=>bucket(m)==="today").length;
  $("#line").innerHTML = state.resp
    ? `<b>${open.length}</b> tâche${open.length>1?"s":""} ouverte${open.length>1?"s":""}`+(late?` · <b>${late}</b> en retard`:"")+(tod?` · <b>${tod}</b> pour aujourd'hui`:"")+`.`
    : `Supervise et valide les tâches de ton staff — <b>${open.length}</b> ouvertes`+(late?` · <b>${late}</b> en retard`:"")+`. Coche pour valider.`;
}
function lucideGo(){ if(window.lucide) window.lucide.createIcons(); }

/* ── greeting + identité ── */
function greet(){
  const h=new Date().getHours();
  return h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir";
}
function identityResp(){ if(URL_OVERRIDE) return URL_OVERRIDE; const me=getMe(); return (me&&me!=="*")?me:""; }
function renderHero(){
  const me=getMe(), who=URL_OVERRIDE||(me&&me!=="*"?me:"");
  const day=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  $("#hi").textContent=`${greet()} · ${day}`;
  if(who){ $("#h1").innerHTML=`${esc(greet())}, <em>${esc(who.split(/\s+/)[0])}</em>`; }
  else if(me==="*"){ $("#h1").innerHTML=`Vue <em>manager</em>`; }
  else { $("#h1").innerHTML=`Ma <em>journée</em>`; }
  // pilule
  const pill=$("#me-pill");
  if(URL_OVERRIDE){ pill.classList.remove("empty"); pill.innerHTML=`<span class="who">${esc(initial(URL_OVERRIDE))}</span>Vue de ${esc(URL_OVERRIDE)}<span class="chg">· ${me?"revenir à moi":""}</span>`; }
  else if(me==="*"){ pill.classList.remove("empty"); pill.innerHTML=`<span class="who">★</span>Manager<span class="chg">· changer</span>`; }
  else if(me){ pill.classList.remove("empty"); pill.innerHTML=`<span class="who">${esc(initial(me))}</span>${esc(me)}<span class="chg">· ${lockedMember()?"connecté":"changer"}</span>`; }
  else { pill.classList.add("empty"); pill.innerHTML=`<span class="who">?</span>Qui es-tu&nbsp;?`; }
  // recherche : seulement en vue large (manager / tout)
  $("#searchwrap").hidden = !!state.resp ? true : false;
}
function applyIdentity(){ state.resp=identityResp(); renderHero(); }

/* Identité authentifiée (serveur, non falsifiable) : un MEMBER est épinglé à sa
   propre personne — pas de « voir comme », pas de « Manager ». Owner & supervisor
   gardent leur vue large légitime. (Verrou UI ; l'isolation au niveau base — JWT
   par utilisateur — reste à brancher, cf. plan.) */
function lockedMember(){ const id=window.MTG_IDENTITY; return (id && id.role==="member" && id.person) ? id.person : ""; }
function openPicker(){
  if(lockedMember()) return;   // un member ne peut pas changer d'identité
  $("#picker-grid").innerHTML=teamFrom(ALL).map(n=>`<button class="pk" type="button" data-pick="${esc(n)}"><span class="av">${esc(initial(n))}</span>${esc(n)}</button>`).join("");
  $("#picker-bd").classList.add("show");
}
function closePicker(){ $("#picker-bd").classList.remove("show"); }
function clearURLParam(){ if(location.search) history.replaceState(null,"","todo.html"); }
function pickMe(name){ if(lockedMember()) return; URL_OVERRIDE=""; setMe(name); clearURLParam(); applyIdentity(); closePicker(); render(); }
function pickManager(){ if(lockedMember()) return; URL_OVERRIDE=""; setMe("*"); clearURLParam(); applyIdentity(); closePicker(); render(); }
function bootIdentity(){
  const lm=lockedMember();
  if(lm){ URL_OVERRIDE=""; setMe(lm); clearURLParam(); applyIdentity(); return; }   // épinglé : ignore ?resp= et le picker
  const urlResp=(new URLSearchParams(location.search).get("resp")||"").trim();
  if(urlResp){ URL_OVERRIDE=urlResp; applyIdentity(); return; }
  applyIdentity();
  if(!getMe()) openPicker();
}

async function toggleDone(nd){
  const m=ALL.find(x=>x.ndeg===nd); if(!m) return;
  if(!m.id || !isLive()){ flash("Hors-ligne : non enregistré en base","warn"); return; }
  const wasDone=DONE_STATUS.has(m.statut);
  const prev={statut:m.statut, closedAt:m.closedAt};
  if(wasDone){ m.statut="En cours"; m.closedAt=""; } else { m.statut=STATUT_CLOTURE; m.closedAt=todayISO(); }
  render();
  try{ if(wasDone) await reopenTask(m.id,m.ndeg); else await closeTask(m.id,m.ndeg); }
  catch(err){ m.statut=prev.statut; m.closedAt=prev.closedAt; render(); flash("Échec — non enregistré","err"); }
}

function bind(){
  $("#search").addEventListener("input",e=>{ state.q=e.target.value; render(); });
  $("#toggle-done").addEventListener("click",e=>{ state.showDone=!state.showDone; e.target.textContent=state.showDone?"Masquer les faits":"Voir les faits"; render(); });
  $("#me-pill").addEventListener("click",()=>{ if(URL_OVERRIDE && getMe()){ URL_OVERRIDE=""; clearURLParam(); applyIdentity(); render(); } else openPicker(); });
  $("#picker-grid").addEventListener("click",e=>{ const b=e.target.closest("[data-pick]"); if(b) pickMe(b.dataset.pick); });
  $("#pk-manager").addEventListener("click",pickManager);
  $("#picker-close").addEventListener("click",closePicker);
  $("#picker-bd").addEventListener("click",e=>{ if(e.target.id==="picker-bd") closePicker(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePicker(); });
  $("#list").addEventListener("click",e=>{
    const chk=e.target.closest("[data-check]"); if(chk){ e.stopPropagation(); toggleDone(chk.dataset.check); return; }
    const op=e.target.closest("[data-open]"); if(op){ const t=ALL.find(x=>x.ndeg===op.dataset.open);
      if(window.openBriefModal && t) openBriefModal(t); else location.href="tache.html?code="+encodeURIComponent(op.dataset.open); }
  });
}

async function boot(){
  try{ ALL=await loadBriefsLive(); }catch(e){ ALL=[]; }
  window.ALL = ALL;
  BYNDEG={}; ALL.forEach(m=>BYNDEG[m.ndeg]=m);
  window.BYNDEG = BYNDEG;
  bind(); bootIdentity(); render();
  $("#src").textContent=(window.SUPA_SOURCE==="supabase")?"Source : Supabase (live)":(window.SUPA_SOURCE==="csv")?"Source : INDEX.csv (hors-ligne)":"Source : —";
  if(window.sourceBanner) sourceBanner();
  lucideGo();
}
document.addEventListener("DOMContentLoaded", boot);
</script>

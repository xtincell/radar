# Configuration Cloudflare Pages — Matanga RADAR
# Déploiement : `npx wrangler pages deploy`
# Le dossier servi est briefs/ (toutes les pages, supa.js, INDEX.csv de repli).
name = "matanga-radar"
pages_build_output_dir = "briefs"
compatibility_date = "2026-06-18"

# Mots de passe par utilisateur (en clair, repo privé) — stockés côté serveur dans
# Cloudflare KV (jamais exposés au navigateur). Alimente functions/profil.js (self-service)
# et le mur functions/_middleware.js. Namespace créé le 2026-06-21.
[[kv_namespaces]]
binding = "DASH_USERS"
id = "ec1d055a5c334be7a325b92cfff9cfcd"
